# --- Redirection vers le domaine principal (avec www) ---
[[redirects]]
  from = "https://auberge-de-la-cascade.fr/*"
  to = "https://www.auberge-de-la-cascade.fr/:splat"
  status = 301
  force = true

# --- Anciennes adresses du site Nuxt ---
[[redirects]]
  from = "/reservationHotel"
  to = "/reservation-hotel.html"
  status = 301
[[redirects]]
  from = "/alentour"
  to = "/alentours.html"
  status = 301
[[redirects]]
  from = "/reservationsend"
  to = "/merci.html"
  status = 301
[[redirects]]
  from = "/formsend"
  to = "/merci.html"
  status = 301

# --- Page introuvable ---
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# --- Securite ---
# frame-ancestors autorise l'apercu de l'editeur du site, et lui seul :
# Booking A Table (« Mon site » sur www.bookatable.fr).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "frame-ancestors 'self' https://www.bookatable.fr https://bookatable.fr"

# --- HTML : toujours a jour ---
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --- content.json : jamais en cache (secours quand l'API Booking A Table ne repond pas) ---
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# --- Images : cache long ---
# Access-Control-Allow-Origin : l'export « Mes textes et mes photos » de Booking A Table
# telecharge les photos depuis le navigateur (lecture seule, photos deja publiques).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
